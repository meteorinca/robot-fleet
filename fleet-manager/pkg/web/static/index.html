<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Manager</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1018;color:#e1e7ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#1e3044a0,transparent 55%);min-height:100vh}main{max-width:1320px;margin:auto;padding:38px 28px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:24px;font-weight:550;letter-spacing:-.7px;margin:0}small,.muted{color:#8d9aab;font-size:12px}nav{margin:32px 0 24px;border-bottom:1px solid #ffffff12;display:flex;gap:26px}button{font:inherit;cursor:pointer;color:inherit;background:#ffffff08;border:1px solid #ffffff20;border-radius:7px;padding:9px 16px}button:hover{background:#ffffff12}button:disabled{opacity:.5;cursor:wait}nav button{border:0;border-radius:0;background:none;padding:0 0 14px;color:#8d9aab}nav button[aria-selected=true]{color:#7bd6ff;border-bottom:2px solid #7bd6ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.card,.table-wrap{background:#ffffff04;border:1px solid #ffffff12;border-radius:12px;backdrop-filter:blur(16px)}.card{padding:20px}.card label{font-size:11px;color:#8d9aab;text-transform:uppercase;letter-spacing:1px}.card strong{display:block;font-size:30px;font-weight:500;margin-top:9px}.toolbar{margin-bottom:16px}input,select{font:inherit;color:inherit;background:#141c28;border:1px solid #ffffff20;padding:9px 12px;border-radius:7px}input{min-width:210px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8d9aab;font-weight:500;padding:16px}td{padding:15px 16px;border-top:1px solid #ffffff0c}a{color:#c5d8eb;text-decoration:none}a:hover{text-decoration:underline}.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:#ffffff09;color:#8d9aab}.online{color:#7ce6b6;background:#7ce6b610}.offline{color:#e2a49c;background:#e2a49c0c}pre{padding:24px;overflow:auto;max-height:70vh;font-size:12px;line-height:1.6}.footer{display:flex;justify-content:space-between;margin-top:16px;font-size:11px;color:#8d9aab}#message{color:#e2a49c;font-size:12px}#connection{font-size:11px;color:#7ce6b6}tr[title]{cursor:help}@media(max-width:700px){main{padding:24px 14px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px}.card strong{font-size:25px}}
</style></head><body><main>
<header><h1>Fleet Manager</h1><span id="connection">Connecting</span></header>
<nav role="tablist"><button role="tab" aria-selected="true" data-view="fleet">Fleet</button><button role="tab" aria-selected="false" data-view="inventory">Inventory JSON</button></nav>
<div class="stats"><div class="card"><label>Discovered</label><strong id="known">0</strong></div><div class="card"><label>Online</label><strong id="online">0</strong></div><div class="card"><label>Offline</label><strong id="offline">0</strong></div><div class="card"><label>Targets</label><strong id="targets">27</strong></div></div>
<section id="fleet"><div class="toolbar"><div><input id="search" type="search" placeholder="Find a bot" aria-label="Find a bot"> <select id="filter" aria-label="Fleet filter"><option value="known">Discovered bots</option><option value="all">All targets</option><option value="online">Online</option><option value="offline">Offline</option></select></div><button id="scan">Scan now</button></div>
<div class="table-wrap"><table><thead><tr><th>Bot</th><th>Status</th><th>Firmware</th><th>Ping</th><th>Uptime</th><th>Heap</th><th>Last seen</th></tr></thead><tbody id="bots"></tbody></table></div></section>
<section id="inventory" hidden><div class="table-wrap"><pre id="json"></pre></div></section>
<div class="footer"><span id="updated">Waiting for responses</span><span>Wi-Fi / mDNS</span></div><p id="message" role="status"></p>
</main><script>
let state={bots:[]};const $=id=>document.getElementById(id);const dash='\u2212';
function age(value){if(!value)return dash;const s=Math.max(0,Math.floor((Date.now()-Date.parse(value))/1000));return s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago'}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td}
function render(){const bots=state.bots;$('known').textContent=bots.filter(b=>b.exists).length;$('online').textContent=bots.filter(b=>b.status==='online').length;$('offline').textContent=bots.filter(b=>b.exists&&b.status==='offline').length;$('targets').textContent=bots.length;
const query=$('search').value.toLowerCase(),filter=$('filter').value;const visible=bots.filter(b=>(filter==='all'||filter==='known'&&b.exists||filter===b.status)&&b.hostname.includes(query));$('bots').replaceChildren();
for(const b of visible){const row=document.createElement('tr');row.title=[b.error,b.ip?'Observed IP: '+b.ip:'',b.last_telemetry_at?'Telemetry: '+new Date(b.last_telemetry_at).toLocaleString():''].filter(Boolean).join('\n');const link=document.createElement('a');link.textContent=b.hostname;link.href=b.url;link.target='_blank';link.rel='noopener';cell(row,'').append(link);const pill=document.createElement('span');pill.className='pill '+b.status;pill.textContent=b.status;cell(row,'').append(pill);cell(row,b.reported_version||(b.telemetry?b.telemetry.firmware:dash));cell(row,b.latency_ms>=0?b.latency_ms.toFixed(1)+' ms':dash);cell(row,b.telemetry?Math.floor(b.telemetry.uptime/60)+' min':dash);cell(row,b.telemetry?(b.telemetry.free_heap/1024).toFixed(0)+' KB':dash);cell(row,age(b.last_seen));$('bots').append(row)}
if(!visible.length){const row=document.createElement('tr');const td=cell(row,'No bots found');td.colSpan=7;$('bots').append(row)}$('json').textContent=JSON.stringify(state,null,2);$('updated').textContent=state.updated_at&&!state.updated_at.startsWith('0001')?'Updated '+age(state.updated_at):'Waiting for responses'}
$('search').oninput=render;$('filter').onchange=render;document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b===button));$('fleet').hidden=button.dataset.view!=='fleet';$('inventory').hidden=button.dataset.view!=='inventory'});
$('scan').onclick=async()=>{$('scan').disabled=true;$('message').textContent='';try{const response=await fetch('/api/scan',{method:'POST'});if(!response.ok)throw Error(await response.text())}catch(error){$('message').textContent=error.message}finally{$('scan').disabled=false}};
const events=new EventSource('/api/events');events.addEventListener('fleet',event=>{state=JSON.parse(event.data);render()});events.onopen=()=>{$('connection').textContent='Live';$('connection').style.color='#7ce6b6'};events.onerror=()=>{$('connection').textContent='Reconnecting';$('connection').style.color='#e2a49c'};setInterval(render,5000);
</script></body></html>
